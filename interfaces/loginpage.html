<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bestand - Acesso ao Sistema</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #fafbfc;
            color: #2c3e50;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background-color: #ffffff;
            border: 1px solid #e1e4e8;
            border-radius: 10px;
            padding: 40px 32px;
            box-shadow: 0 4px 12px rgba(44, 62, 80, 0.05);
        }

        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: -0.5px;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            height: 40px;
            padding: 0 12px;
            font-size: 14px;
            color: #2c3e50;
            background-color: #f8f9fa;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .form-input:focus {
            outline: none;
            background-color: #ffffff;
            border-color: #3498db;
        }

        .form-input::placeholder {
            color: #95a5a6;
        }

        .error-banner {
            display: none; /* Alterar para 'block' para visualizar o estado de erro */
            background-color: #fdecea;
            border: 1px solid #f5c6cb;
            color: #e74c3c;
            font-size: 12px;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        .btn-submit {
            width: 100%;
            height: 42px;
            margin-top: 8px;
            background-color: #3498db;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }

        .btn-submit:active {
            background-color: #2471a3;
        }

        .footer-hint {
            text-align: center;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid #f0f2f5;
            font-size: 12px;
            color: #7f8c8d;
        }

        .footer-hint code {
            background-color: #f4f5f7;
            padding: 2px 6px;
            border-radius: 4px;
            color: #2c3e50;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <h1 class="brand-title">Bestand</h1>
                <p class="brand-subtitle">Sistema de Gestão de Estoque</p>
            </div>

            <!-- Banner de erro para validação de credenciais -->
            <div class="error-banner">
                Usuário ou senha inválidos. Verifique os dados e tente novamente.
            </div>

            <form action="#" method="post">
                <div class="form-group">
                    <label class="form-label" for="username">Perfil de usuário</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Ex: admin" 
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Senha</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="••••••••"
                    >
                </div>

                <button type="submit" class="btn-submit">Entrar no sistema</button>
            </form>

            <div class="footer-hint">
                Acesso padrão do protótipo: <code>admin</code>
            </div>
        </div>
    </div>

</body>
</html>
